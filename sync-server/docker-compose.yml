services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: hot100
      MYSQL_USER: hot100
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      SYNC_TOKEN: ${SYNC_TOKEN:?required}
      TZ: UTC
    ports:
      - "127.0.0.1:18766:8080"
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: hot100
      MYSQL_USER: hot100
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      TZ: UTC
    volumes:
      - ./data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:?required}
      TZ: UTC
    entrypoint: ["/bin/bash", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
