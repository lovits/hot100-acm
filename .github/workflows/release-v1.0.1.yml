name: Publish Hot100 v1.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-work
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'Hot100-*release.zip' --dir release-work
          python3 scripts/repackage_release.py
          git archive --format=zip --prefix=hot100-acm/ --output=release-work/publish/hot100-acm-source.zip HEAD
          cat > release-work/notes.md <<'NOTES'
          ## Hot100 ACM v1.0.1

          启动后直接进入做题页面。首次打开显示第 1 题，之后继续上次练习的题目。点击左上角“LeetCode 热题 100”可打开 100 道题的选择侧栏。

          本版移除了独立的“学习计划／我的进度”首页和做题页面左上角的返回箭头。代码、进度和提交记录仍保存在本机。

          ### 下载

          - `Hot100-Windows-x64-release.zip`：Windows x64 桌面应用
          - `Hot100-macOS-arm64-release.zip`：macOS Apple Silicon 桌面应用
          - `Hot100-macOS-x64-release.zip`：macOS Intel 桌面应用
          - `hot100-acm-source.zip`：本版项目源码

          解压对应平台的压缩包即可使用。第三方作者文章及其配图未包含在源码或发行包中。
          NOTES
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.1 release-work/publish/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.1 release-work/publish/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Hot100 ACM v1.0.1' --notes-file release-work/notes.md --draft
          fi
          gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --draft=false
