name: Publish Hot100 v1.0.15
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Compile plugin runtime and test
        run: |
          cd vscode-extension
          npm ci
          npm run compile
          npm run test:unit
          node scripts/checkReadmeSync.mjs
      - name: Verify desktop and sync code
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/study-plan.test.cjs tests/sync-core.test.cjs
          node verify_frontend.cjs
      - name: Build platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-work/publish
          gh release download v1.0.14 --repo "$GITHUB_REPOSITORY" --pattern 'Hot100-*-release.zip' --dir release-work
          python3 scripts/package_v1_0_5.py 1.0.15
          git archive --format=zip --prefix=hot100-acm/ --output=release-work/publish/hot100-acm-source.zip HEAD
      - name: Smoke test packaged Windows runtime
        run: python3 scripts/smoke_windows.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.15 release-work/publish/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Hot100 ACM v1.0.15 — 学习计划与自建同步' --notes-file release-notes-v1.0.15.md --draft
          gh release edit v1.0.15 --repo "$GITHUB_REPOSITORY" --draft=false --latest
