name: Test VS Code extension
on:
  push:
    paths: ['vscode-extension/**', '.github/workflows/test-vscode.yml']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, windows-latest]
        default: all
        description: Operating systems
      suite:
        type: choice
        options: [all, c]
        default: all
        description: Regression suite
permissions:
  contents: read
jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/check-toolchains.cjs
      - run: npm run compile && npm run lint && npm run test:unit && npm run test:judge
        if: inputs.suite != 'c'
      - run: npm run compile && npm run lint && npm run test:unit && node test/c-core-test.js && node test/c-acm-test.js && node test/c-negative-test.js
        if: inputs.suite == 'c' 
      - run: node test/official-test.js c
      # VSIX is platform-neutral; validate packaging on Unix and run judges on every OS.
      - if: runner.os != 'Windows'
        env:
          HOT100_PRIVATE_SYNC_BUILD: "1"
        run: npx --yes @vscode/vsce@3.7.0 package --no-dependencies --readme-path MARKETPLACE.md --out hot100-practice.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-${{ matrix.os }}
          path: |
            vscode-extension/test/results-*.json
            vscode-extension/*.vsix
