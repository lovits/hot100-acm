name: Publish Hot100 v1.0.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify app and data
        run: |
          python3 verify_content.py
          python3 verify_startup.py
          node verify_frontend.cjs
          node verify_authors.cjs
          node --check dist/local.js
          node --check native_judge/core-driver.js
      - name: Package current platform releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-work
          gh release download v1.0.4 --repo "$GITHUB_REPOSITORY" --pattern Hot100-Windows-x64-release.zip --dir release-work
          gh release download v1.0.1 --repo "$GITHUB_REPOSITORY" --pattern 'Hot100-macOS-*-release.zip' --dir release-work
          python3 scripts/package_v1_0_5.py
          git archive --format=zip --prefix=hot100-acm/ --output=release-work/publish/hot100-acm-source.zip HEAD
      - name: Smoke test packaged Windows runtime
        run: python3 scripts/smoke_windows.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 release-work/publish/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Hot100 ACM v1.0.5 — 高频数据与界面更新' --notes-file release-notes-v1.0.5.md --draft
          gh release edit v1.0.5 --repo "$GITHUB_REPOSITORY" --draft=false
